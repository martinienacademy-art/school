services:
  - name: gestioschool
    type: web
    env: node
    # ensure devDependencies (vite) are installed even in production environment
    buildCommand: rm -rf node_modules && NPM_CONFIG_PRODUCTION=false npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: SUPABASE_URL
        value: https://xdlsyxxbwvveeozxjuip.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        value: edufinance_secret_jwt_2025
      - key: PORT
        value: "10000"
      - key: TZ
        value: Africa/Porto-Novo
      - key: FRONTEND_URL
        value: https://school-7hns.onrender.com
